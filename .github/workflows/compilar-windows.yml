# Genera el programa para Windows (TrazabilidadFIV.exe) sin que nadie tenga que instalar Python.
# Se ejecuta en cada cambio de la rama main o a mano desde la pestaña Actions.
# Publica (o actualiza) la versión vX.Y.Z indicada en VERSION dentro de app.py.
name: Compilar programa para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer versión
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Pruebas automáticas
        run: python -m unittest discover -s pruebas -v

      - name: Crear TrazabilidadFIV.exe
        run: >
          pyinstaller --noconfirm --onefile --name TrazabilidadFIV
          --add-data "static;static"
          --add-data "historico;historico"
          --add-data "herramientas/fuentes;herramientas/fuentes"
          --hidden-import herramientas.generar_hoja
          --collect-submodules reportlab.graphics.barcode
          app.py

      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist/TrazabilidadFIV.exe paquete/
          Copy-Item LEEME-WINDOWS.txt paquete/
          Copy-Item datos/config.ejemplo.json paquete/config.ejemplo.json
          Compress-Archive -Path paquete/* -DestinationPath TrazabilidadFIV-windows.zip

      - name: Guardar como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: TrazabilidadFIV-windows
          path: TrazabilidadFIV-windows.zip

      - name: Publicar la versión con el programa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Trazabilidad FIV ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descarga **TrazabilidadFIV-windows.zip**, descomprímelo y abre `TrazabilidadFIV.exe`.
            Instrucciones en `LEEME-WINDOWS.txt` dentro del ZIP.
          files: TrazabilidadFIV-windows.zip
